packages:
  - 'packages/*'
# pnpm 默认拦截所有依赖的构建脚本；这里放行的几个都是实际需要构建步骤的
# （esbuild 的二进制安装、koffi 的原生模块编译；@google/genai 与 protobufjs
# 由 dsh-any-connect 引入的 pi-ai 间接依赖，同样有必需的构建步骤）。
allowBuilds:
  '@google/genai': true
  esbuild: true
  koffi: true
  protobufjs: true
# 供应链防护：依赖发布满 24 小时才允许安装。稳定线（本分支）的 dsh 官方
# 包都早已超过 24 小时，无需排除清单；预发布线（alpha 分支）要即时跟进 dsh
# 预发布包，在那边维护 minimumReleaseAgeExclude 清单（adapt-dsh.mjs 改写）。
autoInstallPeers: false
