# @chaoset/vision-router bundle patch
#
# Installed automatically by:
#   dsh plugin --profile <name> add @chaoset/vision-router
#
# This patch inserts the host plugin row. The package is also a normal npm
# dependency of the profile; the `dsh.bundle.patch` manifest field makes DSH
# treat it as a profile bundle layer.

- insert:
    - id: vision-router
      name: '@chaoset/vision-router'
      config:
        compressImageBytes: 4194304
        compressMaxDimension: 1600
        compressTargetBytes: 2097152
        compressFallbackDimension: 1200
