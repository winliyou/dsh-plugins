name: Publish to npm

on:
  push:
    branches:
      # main = 稳定线（dsh-any-connect 锁 rc.2 依赖，发 latest）
      # alpha = dsh alpha 适配线（发 -alpha.N 到 alpha tag）
      - main
      - alpha
    paths:
      - 'packages/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  release:
    types: [published]
  workflow_dispatch:

# 连续推送时避免两个发布流程并发跑(检测-发布窗口会互相踩)。
# 不取消进行中的发布:已开始的 npm publish 让它跑完,排队的用最新代码重来。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC): publish without a long-lived token
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # pnpm is the only toolchain entry point: install / test / version reads
      # all run through pnpm. pnpm 版本取自 package.json 的 packageManager 字段,
      # 与本地保持一致(Corepack 也认这个字段)。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # setup-node 提供 Node(下面的 `node -e` 与 pnpm 自身都要用)并缓存
      # pnpm store;必须在 action-setup 之后,cache: pnpm 才能找到 store 路径。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:ci

      - name: Detect changed packages
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$IS_DISPATCH" = "true" ]; then
            # Manual trigger: every package is a candidate; publishing skips
            # versions that already exist on the registry.
            CHANGED=$(ls packages | tr '\n' ' ' | sed 's/ $//')
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD -- packages | awk -F/ 'NF >= 2 {print $2}' | sort -u)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$SHA" -- packages | awk -F/ 'NF >= 2 {print $2}' | sort -u)
          fi
          echo "changed=$(echo "$CHANGED" | tr '\n' ' ' | sed 's/ $//')" >> "$GITHUB_OUTPUT"

      - name: Publish changed packages
        run: |
          CHANGED="${{ steps.changed.outputs.changed }}"
          if [ -z "$CHANGED" ]; then
            echo "No package changes detected, skipping publish."
            exit 0
          fi

          for pkg in $CHANGED; do
            PKG_DIR="packages/$pkg"
            if [ ! -f "$PKG_DIR/package.json" ]; then
              echo "Skip $PKG_DIR: not a package directory"
              continue
            fi

            PKG_NAME=$(node -e "console.log(require('./$PKG_DIR/package.json').name)")
            PKG_VERSION=$(node -e "console.log(require('./$PKG_DIR/package.json').version)")
            echo "Checking $PKG_NAME@$PKG_VERSION ..."

            PUBLISHED=$(pnpm view "$PKG_NAME@$PKG_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)
            if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
              echo "$PKG_NAME@$PKG_VERSION already published, skipping."
              continue
            fi

            # dist-tag: 正式版走 latest,预发布版（如 0.10.2-alpha.0）走它的
            # prerelease 标签（alpha / rc / beta）。npm 默认一律打 latest,
            # 会让 `npm install <pkg>` 拉到预发布版;这里按 dsh 自身的发布
            # 方式(0.1.2-alpha.3 挂在 alpha tag 上)对齐。
            # 纯字符串解析,不引入 semver 依赖:取 '-' 后第一段里的首个
            # 字母串(0.10.2-alpha.0 -> alpha;1.2.3-rc.4 -> rc)。
            PKG_TAG=$(printf '%s' "$PKG_VERSION" | sed -n 's/^[^-]*-\([A-Za-z][A-Za-z0-9]*\).*$/\1/p')
            if [ -z "$PKG_TAG" ]; then
              PKG_TAG=latest
            fi
            echo "Publishing $PKG_NAME@$PKG_VERSION under dist-tag '$PKG_TAG' ..."
            cd "$PKG_DIR"
            # `pnpm publish`: OIDC Trusted Publishing happens automatically
            # when id-token: write is set and the package has a trusted
            # publisher configured on npmjs.com. --provenance adds attestation.
            # pnpm 11.0.x 曾在这里抛 404(pnpm/pnpm#11513,已由 #11526 修复),
            # 11.24.0 起 pnpm 自己的发版流程就是走的这条路。
            # --no-git-checks: checkout 出来是 detached HEAD,pnpm 默认的分支
            # 检查会拒绝发布。
            pnpm publish --provenance --access public --no-git-checks --tag "$PKG_TAG" --registry=https://registry.npmjs.org
            cd ../..
          done
