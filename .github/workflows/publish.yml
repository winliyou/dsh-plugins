name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC): publish without a long-lived token
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # The repo pins packageManager (pnpm) for local/corepack use, but CI
          # installs with npm; disable setup-node's package-manager cache or it
          # tries to invoke pnpm, which is not installed on the runner.
          package-manager-cache: false
          # No registry-url here: it would make setup-node write a bogus
          # _authToken into .npmrc, and npm then skips the OIDC exchange
          # (Trusted Publishing) and publishes with invalid basic auth.

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:ci

      - name: Detect changed packages
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$IS_DISPATCH" = "true" ]; then
            # Manual trigger: every package is a candidate; publishing skips
            # versions that already exist on the registry.
            CHANGED=$(ls packages | tr '\n' ' ' | sed 's/ $//')
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD -- packages | awk -F/ 'NF >= 2 {print $2}' | sort -u)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$SHA" -- packages | awk -F/ 'NF >= 2 {print $2}' | sort -u)
          fi
          echo "changed=$(echo "$CHANGED" | tr '\n' ' ' | sed 's/ $//')" >> "$GITHUB_OUTPUT"

      - name: Publish changed packages
        run: |
          CHANGED="${{ steps.changed.outputs.changed }}"
          if [ -z "$CHANGED" ]; then
            echo "No package changes detected, skipping publish."
            exit 0
          fi

          for pkg in $CHANGED; do
            PKG_DIR="packages/$pkg"
            if [ ! -f "$PKG_DIR/package.json" ]; then
              echo "Skip $PKG_DIR: not a package directory"
              continue
            fi

            PKG_NAME=$(node -p "require('./$PKG_DIR/package.json').name")
            PKG_VERSION=$(node -p "require('./$PKG_DIR/package.json').version")
            echo "Checking $PKG_NAME@$PKG_VERSION ..."

            PUBLISHED=$(npm view "$PKG_NAME@$PKG_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)
            if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
              echo "$PKG_NAME@$PKG_VERSION already published, skipping."
              continue
            fi

            echo "Publishing $PKG_NAME@$PKG_VERSION ..."
            cd "$PKG_DIR"
            # --provenance: npm Trusted Publishing via GitHub OIDC (see the
            # package's Trusted Publishing settings on npmjs.com)
            npm publish --provenance --access public --registry=https://registry.npmjs.org
            cd ../..
          done
