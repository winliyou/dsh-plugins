name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC): publish without a long-lived token
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Bun is the only toolchain entry point: install / test / version reads
      # all run through bun. Publishing goes through `bunx npm@latest` because
      # bun can't do npm OIDC trusted publishing yet (oven-sh/bun#15601).
      # bunx resolves the npm CLI and runs it with the runner's system Node
      # (preinstalled on ubuntu-latest), which is the stack that handles the
      # OIDC exchange — no separate setup-node step needed.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:ci

      - name: Detect changed packages
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$IS_DISPATCH" = "true" ]; then
            # Manual trigger: every package is a candidate; publishing skips
            # versions that already exist on the registry.
            CHANGED=$(ls packages | tr '\n' ' ' | sed 's/ $//')
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD -- packages | awk -F/ 'NF >= 2 {print $2}' | sort -u)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$SHA" -- packages | awk -F/ 'NF >= 2 {print $2}' | sort -u)
          fi
          echo "changed=$(echo "$CHANGED" | tr '\n' ' ' | sed 's/ $//')" >> "$GITHUB_OUTPUT"

      - name: Publish changed packages
        run: |
          CHANGED="${{ steps.changed.outputs.changed }}"
          if [ -z "$CHANGED" ]; then
            echo "No package changes detected, skipping publish."
            exit 0
          fi

          for pkg in $CHANGED; do
            PKG_DIR="packages/$pkg"
            if [ ! -f "$PKG_DIR/package.json" ]; then
              echo "Skip $PKG_DIR: not a package directory"
              continue
            fi

            PKG_NAME=$(bun -e "console.log(require('./$PKG_DIR/package.json').name)")
            PKG_VERSION=$(bun -e "console.log(require('./$PKG_DIR/package.json').version)")
            echo "Checking $PKG_NAME@$PKG_VERSION ..."

            PUBLISHED=$(bunx npm view "$PKG_NAME@$PKG_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)
            if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
              echo "$PKG_NAME@$PKG_VERSION already published, skipping."
              continue
            fi

            echo "Publishing $PKG_NAME@$PKG_VERSION ..."
            cd "$PKG_DIR"
            # `bunx npm@latest`: OIDC Trusted Publishing happens automatically
            # when id-token: write is set and the package has a trusted
            # publisher configured on npmjs.com. --provenance adds attestation.
            bunx npm@latest publish --provenance --access public --registry=https://registry.npmjs.org
            cd ../..
          done
